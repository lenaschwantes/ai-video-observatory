name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Ingest synthetic fixtures
        run: observatory ingest --sources fixture --start 2026-10-01 --end 2026-10-14
      - name: Build warehouse and run data tests
        run: dbt build --project-dir transform --profiles-dir transform
      - name: Detect emerging trends
        run: observatory trends | tee trends.txt && grep -q "#aiasmr" trends.txt
