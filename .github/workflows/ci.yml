name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[detect,dev]"
      - name: Unit tests
        run: pytest -q
      - name: Ingest synthetic fixtures
        run: observatory ingest --sources fixture --start 2026-10-01 --end 2026-10-14
      - name: Build warehouse and run data tests
        run: dbt build --project-dir transform --profiles-dir transform
      - name: Detect emerging trends
        run: observatory trends | tee trends.txt && grep -q "#aiasmr" trends.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web image
        run: docker build -t ai-video-observatory .
      - name: Smoke test the running container
        run: |
          docker run -d -p 7860:7860 --name app ai-video-observatory
          for i in $(seq 1 30); do curl -fs "http://localhost:7860/?lang=en" > page.html && break; sleep 1; done
          grep -q "Do AI-video detectors accuse real videos?" page.html
