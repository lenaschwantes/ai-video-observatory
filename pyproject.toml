[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-video-observatory"
version = "0.1.0"
description = "Daily pipeline that tracks AI-generated TikTok videos, classifies them and flags emerging trends before they peak."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
tiktok = ["TikTokApi>=6.5"]
detect = [
    "yt-dlp>=2026.1",
    "scenedetect[opencv-headless]>=0.7",
    "c2pa-python>=0.38",
    "anthropic>=2.4",
    "groq>=1.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
bench = ["openai>=1.50", "google-genai>=1.0"]
eval = ["deepeval>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
observatory = "observatory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
